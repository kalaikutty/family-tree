<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Family Tree</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🌳 Family Tree</h1>
    <div class="header-actions">
      <span id="status" class="status"></span>
    </div>
  </header>

  <main>
    <section class="tree-panel">
      <div id="treeContainer" class="tree-container">
        <p class="empty-msg">Loading family tree…</p>
      </div>
    </section>

    <section class="form-panel">
      <h2>Add Family Member</h2>
      <form id="addForm">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="e.g. Jane Doe" />

        <div id="relationFields" class="hidden">
          <label for="relationship">Relationship type</label>
          <select id="relationship">
            <option>Parent</option>
            <option>Child</option>
            <option>Spouse</option>
            <option>Sibling</option>
            <option>Grandparent</option>
            <option>Grandchild</option>
            <option value="Other">Other (custom)</option>
          </select>

          <div id="customRelWrap" class="hidden">
            <label for="customRel">Custom relationship label</label>
            <input type="text" id="customRel" placeholder="e.g. Cousin" />
          </div>

          <div id="singleRelationWrap">
            <label for="relationTo">Relation to (existing member)</label>
            <select id="relationTo"></select>
          </div>

          <div id="parentsWrap" class="hidden">
            <label for="parent1">Parent 1</label>
            <select id="parent1"></select>

            <label for="parent2">Parent 2 (optional)</label>
            <select id="parent2"></select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">➕ Add Member</button>
      </form>
      <p id="formHint" class="hint"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
